name: Build YA CLIENT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.1.0"
      - name: Compila YAClient.jar
        working-directory: client
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YAClient-jar
          path: client/build/libs/YAClient.jar

  launcher-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Imposta repository nel launcher
        shell: bash
        run: |
          sed -i "s#TUO_UTENTE_GITHUB/ya-client#${{ github.repository }}#" launcher/config.json
      - name: Compila installer .exe
        working-directory: launcher
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: YA-CLIENT-Setup
          path: launcher/dist/YA-CLIENT-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client-jar, launcher-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/YAClient.jar
            out/YA-CLIENT-Setup.exe
