<!doctype html><html><head><meta charset="utf-8"><title>YA CLIENT</title><style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Segoe UI,system-ui,sans-serif}
.card{position:absolute;inset:10px;border-radius:26px;background:#0a0a0d;display:flex;flex-direction:column;align-items:center;justify-content:center;
 box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.05);animation:in .35s ease both}
.card:before{content:"";position:absolute;inset:0;border-radius:26px;background:radial-gradient(ellipse 60% 45% at 50% 38%,rgba(255,255,255,.07),transparent 70%)}
img{position:relative;width:230px;margin-bottom:46px}
.bar{position:relative;width:250px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.fill{height:100%;width:0;border-radius:3px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.55)}
.fill:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:sh 1.3s linear infinite}
@keyframes sh{to{left:100%}}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
body.out .card{opacity:0;transform:scale(1.02);transition:opacity .35s ease,transform .35s ease}
</style></head><body><div class="card"><img src="../assets/splash_logo.png" alt=""><div class="bar"><div class="fill" id="f"></div></div></div>
<script>
var minP=0,shown=0,creep=false,t0=0,done=false;
window.setP=function(p){minP=Math.max(minP,Math.min(100,p))/100};
window.startCreep=function(){if(!creep){creep=true;t0=performance.now()}};
window.finish=function(){done=true;document.body.classList.add('out')};
(function loop(now){
  var target=minP;
  if(creep){var c=0.94*(1-Math.exp(-(now-t0)/9000));target=Math.max(target,c)}
  if(done)target=1;
  shown+= (target-shown)*(done?0.25:0.06);
  document.getElementById('f').style.width=(shown*100).toFixed(2)+'%';
  requestAnimationFrame(loop)
})(performance.now());
</script></body></html>
